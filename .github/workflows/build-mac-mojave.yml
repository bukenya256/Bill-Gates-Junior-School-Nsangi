
name: Build BGS macOS Mojave DMG

on: [workflow_dispatch]

jobs:
  build-mac:
    runs-on: macos-15-intel

    steps:
      - name: Download source code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Install Mojave-compatible Electron
        run: npm install --no-save --no-package-lock electron@26.6.10
        
      
      - name: Build Intel Mac DMG
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          rm -rf dist-mojave
          npx electron-builder --mac dmg --x64 --config electron-builder-mojave.json --publish never

      - name: Upload Mac DMG
        uses: actions/upload-artifact@v4
        with:
          name: BGS-Mojave-Intel-DMG
          path: dist-mojave/*.dmg
          if-no-files-found: error

