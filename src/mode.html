<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bill Gates Junior School – Setup</title>
<link rel="stylesheet" href="shared/ui.css"></head><body class="center-body">
<div class="setup"><div class="logo"><img src="assets/bgs-icon.png" alt="" style="width:75px;height:75px;object-fit:contain"></div><h1>Bill Gates Junior School Nsangi</h1><p class="muted">What is this computer used for? <b>This is chosen once.</b></p>
<div class="choices">
<button class="choice" data-m="hm"><b>Headteacher's PC</b><span>The main computer. Keeps all records – students, fees, receipts, staff and salaries – and receives the teachers' marks. Backs up to the cloud.</span></button>
<button class="choice" data-m="teacher"><b>Teachers' PC</b><span>Director of Studies / teachers. Sees only the student list and classes. Enters marks and prints reports. Connects to the Headteacher's PC automatically after a one-time pairing.</span></button>
</div><p id="err" class="err"></p></div>
<script>document.querySelectorAll('.choice').forEach(b=>b.onclick=async()=>{ if(!confirm('Set this computer as the '+b.querySelector('b').textContent+'?'))return; try{await window.bgs.call('mode.set',b.dataset.m)}catch(e){document.getElementById('err').textContent=e.message}})</script></body></html>
