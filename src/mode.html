<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BGS School System — Sign in</title><link rel="stylesheet" href="shared/ui.css"><style>.setup{max-width:760px}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin-top:28px}.choice{min-height:155px;text-align:left;padding:24px;border:1px solid #dbe4f0;border-radius:16px;background:#fff;cursor:pointer;box-shadow:0 8px 24px #17365d0d;color:#20324b}.choice:hover{border-color:#255ba8;transform:translateY(-2px)}.choice b{display:block;font-size:1.2rem;margin-bottom:10px}.choice span{line-height:1.5;color:#60718a}.muted{text-align:center}@media(max-width:620px){.choices{grid-template-columns:1fr}}</style></head><body class="center-body"><main class="setup"><div class="logo"><img src="assets/bgs-icon.png" alt="School logo" style="width:86px;height:86px;object-fit:contain"></div><h1>Bill Gates Junior School</h1><p class="muted">Choose your role to continue. Each role has its own password.</p><div class="choices"><button class="choice" data-role="hm"><b>Log in as Headteacher</b><span>Manage school records, fees, staff, reports, settings and review marks submitted by teachers.</span></button><button class="choice" data-role="teacher"><b>Log in as Teacher</b><span>Enter and save examination marks, prepare class results and view student information.</span></button></div><p id="err" class="err" role="alert"></p><p class="muted" style="font-size:.8rem;margin-top:26px">Single-computer edition · Windows</p></main><script>document.querySelectorAll('[data-role]').forEach(b=>b.onclick=async()=>{try{const r=await window.bgs.call('role.select',{role:b.dataset.role});if(!r.ok)throw new Error(r.error); }catch(e){document.getElementById('err').textContent=e.message}})</script></body></html>
